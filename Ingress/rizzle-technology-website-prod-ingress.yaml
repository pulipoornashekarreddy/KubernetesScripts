apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rizzle-technology-website-prod-ingress
  namespace: rizzle-technology-prod
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - host: www.rizzle.in
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: rizzle-technology-website-prod
                port:
                  number: 80

    - host: rizzle.in
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: rizzle-technology-website-prod
                port:
                  number: 80
